<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ukrywanie elementow jQuery</title>
</head>
<body>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <h1></h1>
    <script>
        $(function($){
            $('#flip').click( function(){
                $("#panel").slideDown("slow");
            });
        })
    </script>
    <style> 
        #panel,#flip {
            background-color: red;}
        #panel{
            padding: 50px;
             display: none;}

    </style>
    <div id="flip"> Click to slide down danel</div>
    <div id="panel"> Hello World!</div>
</body>
</html>
